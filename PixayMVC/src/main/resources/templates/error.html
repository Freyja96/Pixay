<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error – FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* Colores corporativos de Pixay */
            --WHITE-BACKCOLOR: #F7F7F7;
            --DARK-BACKCOLOR: #001D33;
            --PRIMARY-BLUE: #019CF8;
            --SECONDARY-ORANGE: #ff8c00;
            --LIGHT-BLUE: #73B9ED;
            --LIGHT-ORANGE: #F6A964;
            --DARK-CASE: #33484B;
            --LIGHT-CASE: #D1DEE8;
            --LIGHT-GRAY: #33484B40;

            /* Espaciados y medidas constantes */
            --BORDER-RADIUS-LG: 15px;
        }
        * {
            font-family: Poppins, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--WHITE-BACKCOLOR);
            margin: 0;
            padding: 0;
        }
        /* Estilos para la barra de navegación */
        .navbar-pixay {
            background-color: var(--DARK-BACKCOLOR);
            padding: 10px 20px;
            margin: 0;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }
        .navbar-pixay .container-fluid {
            margin: 0;
            padding: 0;
        }
        .nav-link, .navbar-brand {
            color: white !important;
        }
        .search-bar {
            border-radius: 5px 0 0 5px;
            border: none;
        }
        .search-btn {
            background-color: white;
            border: none;
            color: #ff8c00;
            border-radius: 0 5px 5px 0;
        }
        .profile-section {
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo {
            max-height: 50px
        }
       /* Estilos página de error*/
        .textoError {
            color: var(--SECONDARY-ORANGE);
            font-weight: bold;
        }
        .error-img{
            max-height: 500px;
            max-width: 500px
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">

<nav class="navbar navbar-pixay mb-5">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="#">

            <img src="imagenes/logo.png" class="logo" alt="PIXAY"/>
        </a>

        <div class="d-flex w-50">
            <select class="form-select w-auto bg-info text-white border-0" style="border-radius: 5px 0 0 5px;">
                <option>Todas las categorías</option>
            </select>
            <input type="text" class="form-control search-bar" placeholder="Buscar...">
            <button class="search-btn"><i class="bi bi-search"></i></button>
        </div>

        <div class="profile-section">
            <i class="bi bi-bell-fill text-info fs-4"></i>
            <span class="ms-3">Paula</span>
            <img src="tu-imagen-perfil.jpg" alt="Perfil" class="profile-img">
        </div>
    </div>
</nav>
<div class="text-center mt-5 pt-5">
    <h1 class="textoError">Oops!</h1>
    <h2 class="textoError">Parece que el gato ha estado trasteando con los cables...</h2>
    <img src="imagenes/gato-mensaje-error.png" class="error-img"/>
</div>

</body>
</html>
