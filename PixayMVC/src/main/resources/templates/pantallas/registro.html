<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/registro.css}">

</head>
<body>

<img th:src="@{/imagenes/logo.png}" class="register-logo" alt="Pixay"/>
<div class="container d-flex align-items-center justify-content-center vh-50">
    <div class="card" style="width: 500px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 login-title">Registro</h3>

            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>
            <form th:action="@{/registro}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Usuario" autofocus>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña">
                </div>
                <div class="mb-3">
                    <label for="repassword" class="form-label">Repetir contraseña</label>
                    <input type="password" id="repassword" name="repassword" class="form-control" placeholder="Repetir contraseña">
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button type="submit" class="btn btn-primary login-button">REGISTRATE</button>
                </div>

            </form>

            <p class="text-center mt-3 mb-0 orange-text">
                ¿Ya tienes cuenta? <a class="orange-text" th:href="@{/login}">Inicia sesión</a>
            </p>

            <p class="text-center mt-3 mb-0 text-muted">


            </p>
        </div>
    </div>
</div>
</body>
</html>
