<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Búsqueda</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Masonry y imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/busqueda.css}">
    <style>

    </style>
</head>
<body>
<!--CABECERA-->
<div th:insert="~{/fragments/cabecera}"></div>
<!--CUERPO-->
<div class="container-fluid mt-5">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 sidebar-search">
            <div th:each="cat : ${categoriesObjects}">
                <h5 class="category-title" th:text="${cat.name}">Fotografía</h5>
                <ul class="subcategory-list">
                    <!-- Solo mostramos las subcategorías cuyo categoryId coincida con el ID de la categoría actual -->
                    <li class="subcategory-item" th:each="sub : ${subcategoriesObjects}" th:if="${sub.categoryId == cat.id}">
                        <a th:href="@{/busqueda(subId=${sub.id})}" th:text="${sub.name}">Subcategoría</a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- CONTENIDO PRINCIPAL -->
        <div class="col-md-9 col-lg-10 py-5 px-4">
            <!--no se encuentran resultados-->
            <div th:if="${#lists.isEmpty(imagenes)}" class="text-center py-5">
                <i class="bi bi-search" style="font-size: 4rem; color: var(--LIGHT-CASE);"></i>
                <h3 class="mt-3 text-navy">No se han encontrado resultados</h3>
                <p class="text-muted">Prueba con otras palabras o categorías.</p>
                <a th:href="@{/busqueda}" class="btn btn-primary mt-3">Ver todo el arte</a>
            </div>
            <!--se encuentran resultados-->
            <div th:if="${!#lists.isEmpty(imagenes)}" class="masonry-wrapper">
                <div class="masonry-container" id="gallery-container">
                    <div th:each="img : ${imagenes}" class="masonry-item">
                        <div class="gallery-item">
                            <a th:href="@{/imagen/{id}(id=${img.id})}">
                                <img th:src="'data:image/jpeg;base64,' + ${img.getContentBase64()}"
                                     th:alt="${img.title}"
                                     loading="lazy">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- SENTINEL PARA SCROLL -->
            <div id="loading-sentinel" class="text-center mt-4" th:if="${hasNext}">
                <div class="spinner-border text-info" role="status"></div>
                <p class="text-muted">Cargando más arte...</p>
            </div>
        </div>
    </div>
</div>
<!--BOOTSTRAP JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!--JS PROPIO-->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        let currentPage = 0;
        let isLoading = false;

        const query = [[${query}]];
        const catId = [[${selectedCatId}]];
        const subId = [[${selectedSubId}]];

        const container = document.getElementById('gallery-container');
        const sentinel = document.getElementById('loading-sentinel');

        // Inicializar Masonry
        let msnry = new Masonry(container, {
            itemSelector: '.masonry-item',
            columnWidth: '.masonry-item',
            percentPosition: true,
            transitionDuration: '0.2s'
        });

        imagesLoaded(container, () => msnry.layout());

        // Observer
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading) {
                loadMoreImages();
            }
        }, { rootMargin: '200px' });

        if (sentinel) observer.observe(sentinel);

        function loadMoreImages() {
            if (isLoading) return;
            isLoading = true;
            const nextPage = currentPage + 1;

            let url = `/busqueda/scroll?page=${nextPage}`;
            if (query) url += `&query=${encodeURIComponent(query)}`;
            if (catId) url += `&catId=${catId}`;
            if (subId) url += `&subId=${subId}`;

            // Fetch a la galería general
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.content.length > 0) {
                        currentPage = nextPage;
                        const newItems = [];
                        data.content.forEach(img => {
                            const div = document.createElement('div');
                            div.className = 'masonry-item';
                            div.innerHTML = `
                                <div class="gallery-item">
                                    <a href="/imagen/${img.id}">
                                        <img src="data:image/jpeg;base64,${img.contentBase64}" alt="${img.title}" loading="lazy">
                                    </a>
                                </div>`;
                            container.appendChild(div);
                            newItems.push(div);
                        });

                        imagesLoaded(container, () => {
                            msnry.appended(newItems);
                            msnry.layout();
                        });
                    }

                    if (!data.hasNext || data.content.length === 0) {
                        observer.unobserve(sentinel);
                        sentinel.style.display = 'none';
                    }
                    isLoading = false;
                });
        }
    });
</script>
</body>
</html>
