<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <style>
        :root {
           /*TODO DANI:
              - Utiliza los colores de estilos.css
              - Mete en una hoja de estilos e impórtalo en el html*/
            --WHITE-BACKCOLOR: #F7F7F7;
            --DARK-BACKCOLOR: #001D33;
            --PRIMARY-BLUE: #019CF8;
            --SECONDARY-ORANGE: #ff8c00;
            --LIGHT-BLUE: #73B9ED;
            --LIGHT-ORANGE: #F6A964;
            --DARK-CASE: #33484B;
            --LIGHT-CASE: #D1DEE8;
            --LIGHT-GRAY: #33484B40;

            /* Espaciados y medidas constantes */
            --BORDER-RADIUS-LG: 15px;
        }
        * {
            font-family: Poppins, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--WHITE-BACKCOLOR);
        }
       /* Estilos página de error*/
        .textoError {
            color: var(--SECONDARY-ORANGE);
            font-weight: bold;
        }
        .error-img{
            max-height: 400px;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">
<div th:insert="~{fragments/cabecera}"></div>

<div class="text-center mt-5 pt-5 pb-0 mb-0">
    <h1 class="textoError">Oops!</h1>
    <h2 class="textoError">Parece que el gato ha estado trasteando con los cables...</h2>
    <p>
        <a th:href="@{/}" class="textoError">Volver a la página</a>
    </p>

    <img th:src="@{/imagenes/gato-mensaje-error.png}" class="error-img" alt="Error"/>
</div>
</body>
</html>
