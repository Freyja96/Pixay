<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            /* Colores corporativos de Pixay */
            --WHITE-BACKCOLOR: #F7F7F7;
            --DARK-BACKCOLOR: #001D33;
            --PRIMARY-BLUE: #019CF8;
            --SECONDARY-ORANGE: #ff8c00;
            --LIGHT-BLUE: #73B9ED;
            --LIGHT-ORANGE: #F6A964;
            --DARK-CASE: #33484B;
            --LIGHT-CASE: #D1DEE8;
            --LIGHT-GRAY: #33484B40;

            /* Espaciados y medidas constantes */
            --BORDER-RADIUS-LG: 15px;
        }
        * {
            font-family: Poppins, sans-serif;
        }
        body {
            background-color: var(--WHITE-BACKCOLOR);
        }
        /* Estilos para la barra de navegación */
        .navbar-pixay {
            background-color: var(--DARK-BACKCOLOR);
            padding: 10px 20px;
        }
        .nav-link, .navbar-brand {
            color: white !important;
        }
        .search-bar {
            border-radius: 5px 0 0 5px;
            border: none;
        }
        .search-btn {
            background-color: white;
            border: none;
            color: #ff8c00;
            border-radius: 0 5px 5px 0;
        }
        .profile-section {
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }
        /* Breadcrumb */
        .breadcrumb-pixay {
            padding: 20px 0;
            color: var(--DARK-CASE);
            font-size: 16px;
        }
        .breadcrumb-pixay .arrow {
            color: var(--PRIMARY-BLUE);
            margin: 0 10px;
        }
        .breadcrumb-pixay .actual {
            color: var(--SECONDARY-ORANGE);
            font-weight: bold;
        }

        /* Estilos para la galería */
        .gallery-item { border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 1px solid #ddd; }
        .gallery-item img { width: 100%; display: block; object-fit: cover; }

        /* Botón flotante inferior */
        .btn-upload {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--LIGHT-BLUE);
            color: #f6a963;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 40px;
            border: 4px solid #0b1d2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>
<div th:insert="~{/fragments/cabecera}"></div>

<div class="container">
    <div class="breadcrumb-pixay">
        <span class="actual">Inicio</span>
    </div>

    <div class="row" id="gallery-container">
        <div th:each="img : ${imagenes}" class="col-6 col-md-4 col-lg-3">
            <div class="gallery-item">
                <!--TODO pendiente revisar la ruta para mostrar las imágenes-->
                <img th:src="@{'imagenes/' + ${img.id} + '/contenido'}"
                     th:alt="${img.title}"
                     loading="lazy">
            </div>
        </div>
    </div>

    <div id="loading-sentinel" class="text-center py-4" th:if="${hasNext}">
        <div class="spinner-border text-info" role="status">
            <span class="visually-hidden">Cargando más gatitos...</span>
        </div>
    </div>
</div>

<a class="btn-upload" th:href="@{/subir-imagen}">
    <i class="bi bi-plus-lg"></i>
</a>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 0;
    let isLoading = false;

    //IntersectionObserver para detectar el final de la página
    const observer = new IntersectionObserver((entries) => {
        if (entries.isIntersecting && !isLoading) {
            loadMoreImages();
        }
    }, { threshold: 1.0 });

    const sentinel = document.getElementById('loading-sentinel');
    if (sentinel) observer.observe(sentinel);

    function loadMoreImages() {
        isLoading = true;
        currentPage++;

        fetch(`imagenes?page=${currentPage}&size=12`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gallery-container');

                data.content.forEach(img => {
                    const html = `
                                <div class="col-6 col-md-4 col-lg-3">
                                    <div class="gallery-item">
                                        <img src="/api/imagenes/${img.id}/contenido" alt="${img.title}" loading="lazy">
                                    </div>
                                </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
                if (!data.hasNext) {
                    observer.unobserve(sentinel);
                    sentinel.style.display = 'none';
                }
                isLoading = false;
            });
    }
</script>
</body>
</html>
