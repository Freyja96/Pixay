<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>
<!--CABECERA-->
<div th:insert="~{/fragments/cabecera}"></div>
<!--CUERPO-->
<div class="container mt-5">
    <!--MIGA DE PAN-->
    <h6 class="text-orange fw-bold mb-4">Inicio</h6>
    <!--GALERÍA-->
    <div class="row" id="gallery-container">
        <div th:each="img : ${imagenes}" class="col-6 col-md-4 col-lg-3">
            <div class="gallery-item">
                <img th:src="'data:image/jpeg;base64,' + ${img.getContentBase64()}"
                     th:alt="${img.title}"
                     loading="lazy">
            </div>
        </div>
    </div>
    <!--SPINNER EN LO QUE CARGA-->
    <div id="loading-sentinel" class="text-center py-4" th:if="${hasNext}">
        <div class="spinner-border text-info" role="status">
            <span class="visually-hidden">Cargando más gatitos...</span>
        </div>
    </div>
</div>
<!--TODO AQUÍ IRÁ EL FOOTER CUANDO ESTÉ HECHO-->
<a class="btn-upload" th:href="@{/subir-imagen}">
    <i class="bi bi-plus-lg"></i>
</a>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 0;
    let isLoading = false;

    //IntersectionObserver para detectar el final de la página
    const observer = new IntersectionObserver((entries) => {
        if (entries.isIntersecting && !isLoading) {
            loadMoreImages();
        }
    }, { threshold: 1.0 });

    const sentinel = document.getElementById('loading-sentinel');
    if (sentinel) observer.observe(sentinel);

    function loadMoreImages() {
        isLoading = true;
        currentPage++;

        fetch(`imagenes?page=${currentPage}&size=12`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('gallery-container');

                data.content.forEach(img => {
                    const html = `
                                <div class="col-6 col-md-4 col-lg-3">
                                    <div class="gallery-item">
                                        <img src="data:image/jpeg;base64,${img.contentBase64}" alt="${img.title}" loading="lazy">
                                    </div>
                                </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
                if (!data.hasNext) {
                    observer.unobserve(sentinel);
                    sentinel.style.display = 'none';
                }
                isLoading = false;
            });
    }
</script>
</body>
</html>
