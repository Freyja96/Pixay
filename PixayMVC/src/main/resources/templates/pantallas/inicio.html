<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>
<!--CABECERA-->
<div th:insert="~{/fragments/cabecera}"></div>
<!--CUERPO-->
<div class="container mt-5">
    <!--MIGA DE PAN-->
    <h6 class="text-orange fw-bold mb-4">Inicio</h6>
    <!--GALERÍA-->
    <div class="masonry-wrapper">
        <div class="masonry-container" id="gallery-container">
            <div th:each="img : ${imagenes}" class="masonry-item">
                <div class="gallery-item">
                    <img th:src="'data:image/jpeg;base64,' + ${img.getContentBase64()}"
                         th:alt="${img.title}"
                         loading="lazy">
                </div>
            </div>
        </div>
    </div>
    <!--SCROLL INFINITO CON SPINNER-->
    <div id="loading-sentinel" class="text-center"><!-- th:if="${hasNext}">-->
        <div class="spinner-border text-info" role="status"></div>
        <p class="text-muted">Cargando más arte...</p>
    </div>
    <!--TODO AQUÍ IRÁ EL FOOTER CUANDO ESTÉ HECHO-->
    <a class="btn-upload" th:href="@{/subir-imagen}">
        <i class="bi bi-plus-lg"></i>
    </a>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        let currentPage = 0;
        let isLoading = false;
        const sentinel = document.getElementById('loading-sentinel');
        const container = document.getElementById('gallery-container');

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading) {
                console.log("¡Sentinel detectado!");
                loadMoreImages();
            }
        }, {
            root: null,
            threshold: 0.01,
            rootMargin: '200px'
        });

        if (sentinel) observer.observe(sentinel);

        function loadMoreImages() {
            if (isLoading) return;
            isLoading = true;

            const nextPage = currentPage + 1;

            fetch(`/imagenes?page=${nextPage}&size=12`)
                .then(response => response.json())
                .then(data => {
                    console.log("Fotos recibidas: " + data.content.length);

                    if (data.content.length > 0) {
                        currentPage = nextPage;
                        data.content.forEach(img => {
                            const html = `
                        <div class="masonry-item">
                            <div class="gallery-item">
                                <img src="data:image/jpeg;base64,${img.contentBase64}" alt="${img.title}" loading="lazy">
                            </div>
                        </div>`;
                            container.insertAdjacentHTML('beforeend', html);
                        });
                    }

                    // Ajusta 'data.last' según lo que devuelva tu Spring Page
                    if (data.last || data.content.length === 0) {
                        observer.unobserve(sentinel);
                        sentinel.style.display = 'none';
                    }
                    isLoading = false;
                })
                .catch(err => {
                    console.error("Error en el fetch:", err);
                    isLoading = false;
                });
        }
    });
</script>
</body>
</html>
