<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Mis imágenes</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            /* Colores corporativos de Pixay */
            --WHITE-BACKCOLOR: #F7F7F7;
            --DARK-BACKCOLOR: #001D33;
            --PRIMARY-BLUE: #019CF8;
            --SECONDARY-ORANGE: #ff8c00;
            --LIGHT-BLUE: #73B9ED;
            --LIGHT-ORANGE: #F6A964;
            --DARK-CASE: #33484B;
            --LIGHT-CASE: #D1DEE8;
            --LIGHT-GRAY: #33484B40;
            
            /* Espaciados y medidas constantes */
            --BORDER-RADIUS-LG: 15px;
        }
        * { 
            font-family: Poppins, sans-serif; 
        }
        body { 
            background-color: var(--WHITE-BACKCOLOR);
        }
        /* Estilos para la barra de navegación */
        .navbar-pixay { 
            background-color: var(--DARK-BACKCOLOR); 
            padding: 10px 20px; 
        }
        .nav-link, .navbar-brand { 
            color: white !important; 
        }
        .search-bar { 
            border-radius: 5px 0 0 5px; 
            border: none; 
        }
        .search-btn { 
            background-color: white; 
            border: none; 
            color: #ff8c00; 
            border-radius: 0 5px 5px 0; 
        }
        .profile-section { 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .profile-img {
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            object-fit: cover;
        }
        /* Breadcrumb */
        .breadcrumb-pixay { 
            padding: 20px 0; 
            color: var(--DARK-CASE); 
            font-size: 16px; 
        }
        .breadcrumb-pixay .arrow { 
            color: var(--PRIMARY-BLUE); 
            margin: 0 10px; 
        }
        .breadcrumb-pixay .actual { 
            color: var(--SECONDARY-ORANGE); 
            font-weight: bold; 
        }

        /* Estilos para la galería */
        .gallery-item { border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 1px solid #ddd; }
        .gallery-item img { width: 100%; display: block; object-fit: cover; }

        /* Botón flotante inferior */
        .btn-upload {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--LIGHT-BLUE);
            color: #f6a963;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 40px;
            border: 4px solid #0b1d2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-pixay sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="#">PIXAY</a>

        <div class="d-flex w-50">
            <select class="form-select w-auto bg-info text-white border-0" style="border-radius: 5px 0 0 5px;">
                <option>Todas las categorías</option>
            </select>
            <input type="text" class="form-control search-bar" placeholder="Buscar...">
            <button class="search-btn"><i class="bi bi-search"></i></button>
        </div>

        <div class="profile-section">
            <i class="bi bi-bell-fill text-info fs-4"></i>
            <span class="ms-3">Paula</span>
            <img src="tu-imagen-perfil.jpg" alt="Perfil" class="profile-img">
        </div>
    </div>
</nav>

<div class="container">
    <div class="breadcrumb-pixay">
        <span class="actual">Mi perfil</span>
    </div>
    <div class="row">
        <div class="col-12 mb-5">
            <div class="d-flex align-items-start gap-4">
                <img th:src="${usuario.fotoUrl != null ? usuario.fotoUrl : '/img/default-avatar.png'}" 
                    th:alt="${usuario.username}" 
                    class="rounded-circle shadow-sm" 
                    style="width: 150px; height: 150px; object-fit: cover;">
                
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold text-navy mb-0" th:text="${usuario.username}">Nombre Usuario</h2>
                        <button class="btn btn-primary px-4 py-2" style="border-radius: 8px;">Editar perfil</button>
                    </div>

                    <div class="d-flex gap-3 mb-4">
                        <button class="btn btn-outline-dark px-4" style="border-radius: 10px;">
                            <span th:text="${usuario.seguidoresCount}">0</span> Seguidores
                        </button>
                        <button class="btn btn-outline-dark px-4" style="border-radius: 10px;">
                            <span th:text="${usuario.seguidosCount}">0</span> Seguidos
                        </button>
                    </div>

                    <p class="text-muted" style="max-width: 800px; line-height: 1.6;" 
                    th:text="${usuario.bio != null ? usuario.bio : 'Este usuario aún no tiene biografía.'}">
                        Descripción del usuario...
                    </p>
                </div>
            </div>
        </div>

        <div class="col-12 mb-4">
            <div class="row g-0 border-bottom">
                <div class="col-6">
                    <button class="btn btn-primary w-100 py-3 fw-bold" 
                            style="border-radius: 10px 10px 0 0; border: none;">
                        Mis imágenes
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-secondary w-100 py-3 fw-bold border-0" 
                            style="color: var(--DARK-CASE);">
                        Imágenes guardadas
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <!-- TODO testear lógica para mostrar imágenes desde base de datos -->
        <div class="col-md-3">
            <div class="gallery-item">
                <img src="imagen-gato-galaxia.jpg" alt="Imagen 1">
            </div>
            <!-- ir cargando nuevas filas según scroll-->
        </div>
        <div class="col-md-3">
            <div class="gallery-item">
                <img src="imagen-gato-pajarita.jpg" alt="Imagen 2">
            </div>
        </div>
        <div class="col-md-3">
            <div class="gallery-item">
                <img src="imagen-gato-cuadro.jpg" alt="Imagen 3">
            </div>
            <div class="gallery-item">
                <img src="imagen-tres-gatos.jpg" alt="Imagen 4">
            </div>
        </div>
        <div class="col-md-3">
            <div class="gallery-item">
                <img src="tu-imagen-gato-primer-plano.jpg" alt="Imagen 5">
            </div>
        </div>
    </div>
</div>

<a href="#" class="btn-upload">
    <i class="bi bi-plus-lg"></i>
</a>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
