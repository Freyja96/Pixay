<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Masonry y imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/editar-perfil.css}">
</head>
<body>
<div th:insert="~{fragments/cabecera}"></div>

<div class="form-container">
    <h2>Editar Perfil</h2>

    <form th:action="@{/mi-perfil/editar-perfil}" th:object="${usuario}" method="POST">

        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username" th:value="${usuario.username}" required />
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" th:value="${usuario.email}" required />
        </div>

        <div class="form-group">
            <label for="bio">Biografía</label>
            <textarea id="bio" name="bio" th:text="${usuario.description}" placeholder="Cuéntanos algo sobre ti..."></textarea>
        </div>

        <div class="form-group">
            <label for="password">Nueva Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" />
            <div class="help-text">Déjalo en blanco si no deseas cambiar tu contraseña.</div>
        </div>
        <div class="form-group">
            <label for="password">Repite la nueva contraseña</label>
            <input type="password" id="password2" name="password2" placeholder="••••••••" />
            <div class="help-text">Déjalo en blanco si no deseas cambiar tu contraseña.</div>
        </div>

        <button type="submit" class="btn-submit">Guardar Cambios</button>

        <a th:href="@{/mi-perfil}" class="cancel-link">Cancelar</a>
    </form>

    <div th:if="${session.usuarioIdLogueado != null && usuario.id == session.usuarioIdLogueado}"
         th:insert="~{/fragments/footer}"> </div>
</div>

</body>
</html>
