<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${imagen.title} + ' - Pixay'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/detalle.css}">
</head>
<body>
<div th:insert="~{/fragments/cabecera}"></div>

<div class="container mt-5 mb-5 pt-5">
    <div class="post-container">

        <!-- SECCIÓN 1: AUTOR (Avatar y Nombre) (Si no hay foto de perfil se pone logo por defecto por ahora-->
        <div class="d-flex align-items-center mb-2" th:if="${autor != null}">
            <a th:href="@{/usuario/{id}(id=${autor.id})}"><img th:src="${autor.profilePicture != null ? autor.profilePicture : '/imagenes/sin-foto-perfil.png'}"
                 class="author-img" alt="Avatar"></a>
            <span class="author-name" th:text="${autor.username}">Usuario</span>
        </div>

        <p class="image-title fw-bold" th:text="${imagen.title}"></p>

        <!-- SECCIÓN 3: IMAGEN PRINCIPAL -->
        <div class="text-center">
            <img th:src="'data:image/jpeg;base64,' + ${imagen.getContentBase64()}"
                 class="img-main" th:alt="${imagen.title}">
        </div>

        <!-- SECCIÓN 4: BARRA DE ICONOS (Debajo de la imagen) -->
        <div class="icon-bar">
            <i class="bi bi-emoji-smile" title="Reaccionar"></i>
            <i class="bi bi-bookmark" title="Guardar"></i>
            <!-- Descargar -->

            <a th:href="'data:image/jpeg;base64,' + ${imagen.getContentBase64()}"
               th:download="${imagen.title} + '.jpg'" style="color: inherit;">
                <i class="bi bi-arrow-down" title="Descargar"></i>
            </a>

        </div>

        <!-- SECCIÓN 5: CHAT -->
        <div id="chat-messages">
            <!-- Los mensajes se cargan por JS -->
        </div>

        <!-- SECCIÓN 6: INPUT -->
        <div class="chat-input-container position-relative">
            <!-- Lista de emojis -->
            <div id="emoji-picker" class="pixay-emoji-picker shadow">
                <div class="emoji-grid">
                    <img th:src="@{/imagenes/emojis/cowboy-gato.png}" data-code=":cowboy:" class="emoji-item" title="Cowboy">
                    <img th:src="@{/imagenes/emojis/gema-gato.png}" data-code=":gema:" class="emoji-item" title="Gema">
                    <img th:src="@{/imagenes/emojis/rosa-gato.png}" data-code=":rosa:" class="emoji-item" title="Rosa">
                    <img th:src="@{/imagenes/emojis/enfado-gato.png}" data-code=":enfado:" class="emoji-item" title="Enfado">
                    <img th:src="@{/imagenes/emojis/risa-gato.png}" data-code=":risa:" class="emoji-item" title="Risa">
                    <img th:src="@{/imagenes/emojis/triste-gato.png}" data-code=":triste:" class="emoji-item" title="Triste">
                    <img th:src="@{/imagenes/emojis/like-gato.png}" data-code=":like:" class="emoji-item" title="Like">
                    <img th:src="@{/imagenes/emojis/dislike-gato.png}" data-code=":dislike:" class="emoji-item" title="Dislike">
                </div>
            </div>
            <!-- Botón de emoji -->
            <i class="bi bi-emoji-smile-fill fs-3 me-2 cursor-pointer" id="btn-emoji" style="color: #000;"></i>

            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="form-control chat-input">
            </div>
            <button class="btn-send-blue" id="btn-send">
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/footer}"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // 1. Configuración inicial
    const socket = io('http://localhost:3000');
    const imageId = /*[[${imagen.id}]]*/ 0;
    const username = /*[[${session.username}]]*/ 'Anónimo';
    const userAvatar = /*[[${session.avatar}]]*/ '/imagenes/logo.png';

    const chatContainer = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const emojiPicker = document.getElementById('emoji-picker');
    const btnEmoji = document.getElementById('btn-emoji');

    // 2. Mapeo de Emojis (Asegúrate de que el data-code del HTML coincida con estas claves)
    const emojiMap = {
        ':cowboy:':     /*[[@{/imagenes/emojis/cowboy-gato.png}]]*/ '',
        ':gema:':       /*[[@{/imagenes/emojis/gema-gato.png}]]*/   '',
        ':rosa:':       /*[[@{/imagenes/emojis/rosa-gato.png}]]*/   '',
        ':enfado:':     /*[[@{/imagenes/emojis/enfado-gato.png}]]*/ '',
        ':risa:':       /*[[@{/imagenes/emojis/risa-gato.png}]]*/   '',
        ':triste:':     /*[[@{/imagenes/emojis/triste-gato.png}]]*/ '',
        ':like:':       /*[[@{/imagenes/emojis/like-gato.png}]]*/ '',
        ':dislike:':    /*[[@{/imagenes/emojis/dislike-gato.png}]]*/ '',
    };

    // 3. Funciones de ayuda
    function parseEmojis(text) {
        if (!text) return "";
        let parsedText = text;
        Object.keys(emojiMap).forEach(code => {
            const imgHtml = `<img src="${emojiMap[code]}" class="emoji-in-text" style="width:22px; height:22px; vertical-align:middle;">`;
            parsedText = parsedText.split(code).join(imgHtml);
        });
        return parsedText;
    }

    function appendMessage(data) {
        // Aceptamos tanto .contenido (socket) como .content (base de datos)
        const textoReal = data.contenido || data.content;
        if(!textoReal) return;

        const isMe = data.username === username;
        const row = document.createElement('div');
        row.className = `chat-msg-row ${isMe ? 'msg-row-me' : 'msg-row-other'}`;

        const avatarUrl = data.avatar || '/imagenes/logo.png';
        const avatarHtml = isMe ? '' : `<img src="${avatarUrl}" class="chat-avatar">`;

        row.innerHTML = `
            ${avatarHtml}
            <div class="bubble-container">
                <span class="msg-user-name">${isMe ? 'Tú' : data.username}</span>
                <div class="msg-bubble ${isMe ? 'msg-me' : 'msg-other'}">${parseEmojis(textoReal)}</div>
            </div>
        `;
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 4. Lógica de inicio y eventos
    socket.emit('joinImageRoom', imageId);
    socket.on('mensajeRecibido', (data) => appendMessage(data));

    // Cargar mensajes previos (IMPORTANTE: Después de definir appendMessage)
    const mensajesIniciales = /*[[${comentarios}]]*/ [];
    if (mensajesIniciales) {
        mensajesIniciales.forEach(msg => appendMessage(msg));
    }

    // 5. ENVIAR MENSAJE
    document.getElementById('btn-send').onclick = async () => {
        const text = input.value.trim();
        if (!text) return;

        const payload = {
            idProducto: imageId,
            username: username,
            avatar: userAvatar,
            contenido: text
        };

        // Enviamos al socket para tiempo real
        socket.emit('nuevoMensaje', payload);

        // Limpiamos la barra INMEDIATAMENTE para mejorar la experiencia
        input.value = '';

        // Guardamos en BD a través del controlador MVC (puente)
        try {
            await fetch(`/imagen/${imageId}/comentario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text })
            });
        } catch (e) {
            console.error("Error guardando el mensaje:", e);
        }
    };

    // 6. MENÚ DE EMOJIS
    btnEmoji.addEventListener('click', (e) => {
        e.stopPropagation();
        const display = window.getComputedStyle(emojiPicker).display;
        emojiPicker.style.display = (display === 'none') ? 'block' : 'none';
    });

    document.querySelectorAll('.emoji-item').forEach(img => {
        img.onclick = (e) => {
            e.stopPropagation();
            input.value += ` ${img.getAttribute('data-code')} `;
            input.focus();
        };
    });

    document.addEventListener('click', () => { emojiPicker.style.display = 'none'; });
    input.onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('btn-send').click(); };
    /*]]>*/
</script>
</body>
</html>
