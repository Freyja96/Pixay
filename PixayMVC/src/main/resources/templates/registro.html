<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* Colores corporativos de Pixay */
            --WHITE-BACKCOLOR: #F7F7F7;
            --DARK-BACKCOLOR: #001D33;
            --PRIMARY-BLUE: #019CF8;
            --SECONDARY-ORANGE: #ff8c00;
            --LIGHT-BLUE: #73B9ED;
            --LIGHT-ORANGE: #F6A964;
            --DARK-CASE: #33484B;
            --LIGHT-CASE: #D1DEE8;
            --LIGHT-GRAY: #33484B40;

            /* Espaciados y medidas constantes */
            --BORDER-RADIUS-LG: 15px;
        }
        * {
            font-family: Poppins, sans-serif;
        }
        body {
            background-color: var(--DARK-BACKCOLOR);
        }

        /* Botón flotante inferior */
        .btn-upload {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--LIGHT-BLUE);
            color: #f6a963;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 40px;
            border: 4px solid #0b1d2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
        }
        .login-title{
            color: var(--PRIMARY-BLUE);
            font-weight: bold;
        }
        .register-logo {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .card {
            background-color: var(--DARK-BACKCOLOR);
        }
        .card-body {
            background-color: var(--DARK-BACKCOLOR);
        }
        .card-title {
            color: var(--PRIMARY-BLUE);
        }
        .form-label {
            color: var(--LIGHT-CASE);
        }
        .form-control {
            background-color: #002844;
            color: var(--LIGHT-CASE);
        }
        .form-control::placeholder {
            color: #666;
        }
        .btn-primary {
            background-color: var(--PRIMARY-BLUE);
            border-color: var(--PRIMARY-BLUE);
        }
        .text-muted {
            color: var(--LIGHT-CASE) !important;
        }
        .login-button {
            width: 220px;
            height: 60px
        }
        .orange-text {
            color: var(--SECONDARY-ORANGE);
        }
    </style>
</head>
<body>

<img src="imagenes/logo.png" class="register-logo"/>
<div class="container d-flex align-items-center justify-content-center vh-50">
    <div class="card" style="width: 500px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 login-title">Registro</h3>



            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Usuario" autofocus>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="text" id="email" name="username" class="form-control" placeholder="Email" autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña">
                </div>
                <div class="mb-3">
                    <label for="repassword" class="form-label">Repetir contraseña</label>
                    <input type="password" id="repassword" name="repassword" class="form-control" placeholder="Repetir contraseña">
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button type="submit" class="btn btn-primary login-button">SUSCRÍBETE</button>
                </div>

            </form>

            <p class="text-center mt-3 mb-0 orange-text">¿Ya tienes cuenta? Inicia sesión</p>
            <p class="text-center mt-3 mb-0 text-muted">


            </p>
        </div>
    </div>
</div>
</body>
</html>
