<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Cabecera</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/cabecera.css}">
</head>
<body>
    <div class="h-50 w-100 container-fluid ">
        <nav class="fondo-header row p-2 navbar navbar-expand-sm fixed-top" th:fragment="cabecera">
            <div class="col-2">
                <div class=" ps-2">
                    <a th:href="@{/}">
                        <img  class="logo" th:src="@{/imagenes/logo.png}" alt="logo">
                    </a>
                </div>
            </div>
            <div class="col-8 d-flex justify-content-center mt-2 ">
                <div class="search-group d-flex w-100">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle"
                                type="button" id="Menu1"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            [[${selectedCategoryName != null ? selectedCategoryName : 'Todas las categorías'}]]
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="Menu1">
                            <li><a class="dropdown-item" th:href="@{/busqueda}">Todas las categorías</a></li>
                            <li th:each="cat : ${headerCategories}">
                                <a class="dropdown-item" th:href="@{/busqueda(categoryId=${cat.id})}" th:text="${cat.name}"></a>
                            </li>
                        </ul>
                    </div>
                    <form class="d-flex flex-grow-1" th:action="@{/busqueda}" method="get">
                        <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
                        <input type="hidden" name="subcategoryId" th:value="${selectedSubcategoryId}">

                        <input name="query" class="form-control search-input me-2 w-100"
                               type="text" placeholder="Buscar..."
                               th:value="${query}">
                        <button type="submit" class="search-icon-btn">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-1 d-flex align-items-center justify-content-center">
                <div class="notification-container">
                    <i class="bi bi-bell-fill bell-icon"></i>
                    <span class="notification-dot"></span>
                </div>
            </div>
            <div class="col-2">
                <div class="container-fluid d-flex justify-contetn-end align-items-center">
                    <div class="dropdown">
                        <a class="navbar-brand d-flex align-items-center gap-2 dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="text-white small" th:text="${session.username}">Usuario</span>
                            <img th:src="${session.avatar != null ? session.avatar : 'img/default-avatar.png'}"
                                 alt="Avatar Logo"
                                 style="width:40px;height:40px;"
                                 class="rounded-pill object-fit-cover">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/mi-perfil/mis-imagenes}">Mis imágenes</a></li>
                            <li><a class="dropdown-item" th:href="@{/pantallas/ajustes/ajustes}">Mis ajustes</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <script>
        (function() {
            const initDropdown = () => {
                const el = document.getElementById('Menu1');
                if (el && typeof bootstrap !== 'undefined') {
                    new bootstrap.Dropdown(el);
                    console.log("Dropdown de la cabecera inicializado manualmente");
                }
            };

            window.addEventListener('load', initDropdown);
            document.addEventListener('DOMContentLoaded', initDropdown);
            setTimeout(initDropdown, 500);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
