<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Pixay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .fondo {
            background-color:#001D33;
            min-height: 70px; /* Asegura un alto mínimo */
        }
        .logo{
            height:50px;
            width:95px;
            object-fit: contain;
        }
        /* Ajuste para que el buscador no se pegue en móviles si decides mostrarlo */
        @media (max-width: 576px) {
            .logo { width: 70px; height: auto; }
        }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <nav class="fondo navbar navbar-expand-md fixed-top px-3">
        <div class="row w-100 align-items-center">

            <div class="col-4 col-md-2">
                <div class="ps-2">
                    <img class="logo" src="../imagenes/logo.png" alt="logo">
                </div>
            </div>

            <div class="col-md-3 d-none d-md-block">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="Menu1" data-bs-toggle="dropdown">
                        Categorías
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="Menu1">
                        <li><a class="dropdown-item">Animales & Mascotas</a></li>
                        <li><a class="dropdown-item">Arte y DIY</a></li>
                        <li><a class="dropdown-item">Estilo de Vida</a></li>
                        <li><a class="dropdown-item">Estética Visual</a></li>
                        <li><a class="dropdown-item">Moda</a></li>
                        <li><a class="dropdown-item">Diseño</a></li>
                        <li><a class="dropdown-item">Paisajes</a></li>
                        <li><a class="dropdown-item">Video</a></li>
                    </ul>
                </div>
            </div>

            <div class="col-5 col-md-4 mt-1">
                <form class="d-flex">
                    <input class="form-control me-2 d-none d-sm-block" type="text" placeholder="Search">
                    <button class="btn btn-primary" type="button">
                        <span class="d-md-inline">Search</span>
                    </button>
                </form>
            </div>

            <div class="col-1 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" style="fill: rgb(255,255,255);">
                    <circle cx="18" cy="6" r="3"></circle>
                    <path d="M18 19H5V6h8c0-.712.153-1.387.422-2H5c-1.103 0-2 .897-2 2v13c0 1.103.897 2 2 2h13c1.103 0 2-.897 2-2v-8.422A4.962 4.962 0 0 1 18 11v8z"></path>
                </svg>
            </div>

            <div class="col-2 col-md-1 text-end">
                <a class="navbar-brand me-0" href="#">
                    <img src="https://via.placeholder.com/40" alt="Avatar" style="width:40px; height:40px;" class="rounded-pill">
                </a>
            </div>

        </div>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
