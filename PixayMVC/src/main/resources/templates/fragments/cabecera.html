<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Cabecera</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/cabecera.css}">
</head>
<body >
    <div class="h-50 container-fluid ">
        <nav class="fondo row p-2 navbar navbar-expand-sm fixed-top">
            <div class="col-2">
                <div class=" ps-2">
                    <img  class="logo" th:src="@{/imagenes/logo.png}" alt="logo">
                </div>
            </div>
            <div class="col-8 d-flex justify-content-center mt-2 ">
                <div class="search-group d-flex w-100">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="Menu1"  data-bs-toggle="dropdown" >
                            [[${selectedCategoryName != null ? selectedCategoryName : 'Todas las categorías'}]]
                        </button>
                        <ul class="dropdown-menu Menu1" aria-labelledby="menu1">
                            <li><a class="dropdown-item" th:href="@{/busqueda}">Todas las categorías</a></li>
                            <li th:each="cat : ${headerCategories}">
                                <a class="dropdown-item" th:href="@{/busqueda(categoryId=${cat.id})}" th:text="${cat.name}"></a>
                            </li>
                        </ul>
                    </div>
                    <form class="d-flex flex-grow-1 bg-white align-items-center pr-2" th:action="@{/busqueda}" method="get">
                        <input name="query" class="form-control search-input me-2 w-100"
                               type="text" placeholder="Buscar..."
                               th:value="${query}">
                        <button type="submit" class="search-icon-btn">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-1 d-flex align-items-center justify-content-center">
                <div class="notification-container">
                    <i class="bi bi-bell-fill bell-icon"></i>
                    <span class="notification-dot"></span>
                </div>
            </div>
            <div class="col-2">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <!--Aquí va una imagen-->
                        <img src="" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
                        <!--TODO DORIS: aquí tiene que ir el nombre del usuario-->
                    </a>
                </div>
            </div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
