spring.application.name=PixayAPI
server.port=8081

# --- CONFIGURACIÓN DE BASE DE DATOS ---
# Usamos testdb como nombre de la base de datos en memoria
#TODO mirar cómo cargar los datos desde file de nuevo sin que pete
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# Esto ayuda a que Hibernate no se adelante a la consola H2
spring.jpa.defer-datasource-initialization=true

# --- CONSOLA H2 ---
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# --- SEGURIDAD Y JWT ---
JWT_SECRET=VGhpcy1pcy1hLXZlcnktbG9uZy1hbmQtc2VjdXJlLWtleS1mb3ItSldULXRva2Vucw==
JWT_EXPIRATION=24

# Evita que Spring Security genere una contraseña aleatoria en el log
spring.main.allow-bean-definition-overriding=true